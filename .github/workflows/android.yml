name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'
      - name: Build and verify APK
        shell: pwsh
        run: ./build.ps1 -Sdk $env:ANDROID_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: fishzan-android
          path: |
            dist/fishzan.apk
            dist/fishzan-signature.txt
            dist/fishzan-templates.zip
            dist/fanous-template.zip
          if-no-files-found: error
